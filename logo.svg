<svg width="700" height="400" viewBox="0 0 700 400" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- 
        Logo FK - Step 6: Extended F & Shifted K
        F: Brazos extendidos +80px a la derecha.
        K: Desplazada +80px a la derecha.
    -->
    <!-- F: Blanco -->
    <g fill="#FFFFFF">
        <!-- Figura 1: F-Stem (Base Vertical + Brazo Medio Extendido) -->
        <!-- Brazo medio extendido de x=260 a x=340 -->
        <path d="M0 0 H140 V160 H340 V240 H140 V400 H0 Z" />
        
        <!-- Figura 2: F-Top (Trapecio Superior Extendido) -->
        <!-- Extendido de x=420 a x=500. Regreso ajustado a x=400 -->
        <path d="M148 0 H500 L400 100 H148 Z" />
    </g>
    
    <!-- K: Amarillo Full Kong -->
    <g fill="#FFFFFF">
        <!-- Figura 3: K-Arrow (Flecha Superior Desplazada) -->
        <!-- Shift x+80: 280->360, 440->520, 540->620, 340->420 -->
        <path d="M360 160 L520 0 H620 L420 200 L360 200 Z" />

        <!-- Figura 4: K-Leg (Pata Inferior Desplazada) -->
        <!-- Shift x+80: 280->360, 340->420, 540->620, 440->520 -->
        <path d="M360 200 L420 200 L620 400 H520 L360 240 Z" />

        <!-- Figura 5: K-Stem (Tallo Vertical con Corte Superior Invertido) -->
        <!-- Top: Corte diagonal de (360, 260) a (460, 360) - Paralelo a K-Leg (Slope +1) -->
        <!-- Bottom: Base plana en y=400 -->
        <path d="M360 260 L460 360 V400 H360 Z" />
    </g>
</svg>